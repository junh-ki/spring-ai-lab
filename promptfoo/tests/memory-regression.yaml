# Memory-regression cases — the SUT exposes memory by chatId, so a sequence
# of rows sharing the same chatId is a real conversation. promptfoo runs rows
# in order; we use cheap "priming" rows (no real assertion) followed by a
# scored row that should only succeed if memory worked.
#
# These cases are the target of regression-demo.sh — when the chat-memory
# advisor is disabled (via APP_DEMO_MEMORY_DISABLED=true), the checking rows
# fail, demonstrating regression detection end-to-end.
#
# IMPORTANT: must run with -j 1 to preserve row ordering across multi-turn
# conversations. regression-demo.sh and the run.sh helper script handle this.
#
# The `latency` baseline assertion is hoisted into defaultTest.assert in
# promptfooconfig.yaml; we do not repeat it per row here.

# --- conversation A: name recall ---------------------------------------------
- description: 'memory[A] prime — state the user name'
  metadata:
    category: memory-regression
    severity: P2
    subcategory: priming
    conversation: A
  vars:
    prompt: My name is Alice. Please remember it.
    chatId: pf-mem-A
  # No case-specific scoring on the priming turn — defaultTest.assert
  # covers latency + non-empty output.
  assert: []

- description: 'memory[A] check — recall the user name'
  metadata:
    category: memory-regression
    severity: P0
    subcategory: recall-name
    conversation: A
  vars:
    prompt: What is my name?
    chatId: pf-mem-A
  assert:
    - type: contains
      value: Alice
    - type: llm-rubric
      value: |
        The reply surfaces the name "Alice" as the user's name, drawing from
        earlier in this conversation. Variations like "Your name is Alice",
        "Alice", "It's Alice", or "Your name is Alice, correct?" all pass.
        Saying "I don't know" or asking the user to remind it of their name
        FAILS — memory is broken.

# --- conversation B: fact carry-over -----------------------------------------
- description: 'memory[B] prime — share a preference'
  metadata:
    category: memory-regression
    severity: P2
    subcategory: priming
    conversation: B
  vars:
    prompt: I am vegetarian and allergic to peanuts.
    chatId: pf-mem-B
  assert: []

- description: 'memory[B] check — apply earlier preferences to a new request'
  metadata:
    category: memory-regression
    severity: P0
    subcategory: apply-preferences
    domain: clinical
    conversation: B
  vars:
    prompt: Suggest one quick lunch idea for me.
    chatId: pf-mem-B
  assert:
    - type: llm-rubric
      value: |
        The suggestion must respect the previously-stated constraints:
          1. NO meat or fish (vegetarian).
          2. NO peanuts.
        A reply that ignores either constraint, or that asks "do you have
        any dietary restrictions?" (i.e. forgot the priming turn), FAILS.
